---
- name: Sync Cisco IOS interface descriptions and VLANs to NetBox
  hosts: all
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    netbox_url: "{{ lookup('ansible.builtin.env', 'NETBOX_URL') }}"
    netbox_token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
    netbox_site: "{{ lookup('ansible.builtin.env', 'NETBOX_SITE') | default('Default', true) }}"
    netbox_validate_certs: true
    netbox_default_interface_type: 1000base-t
    netbox_interface_type_map:
      Loopback: virtual
      Tunnel: virtual
      Vlan: virtual
      Port-channel: lag

  tasks:
    - name: Validate NetBox connection variables
      ansible.builtin.assert:
        that:
          - netbox_url | length > 0
          - netbox_token | length > 0
        fail_msg: Set NETBOX_URL and NETBOX_TOKEN before running this playbook.

    - name: Gather IOS interface and VLAN resources
      cisco.ios.ios_facts:
        gather_subset:
          - min
        gather_network_resources:
          - interfaces
          - l2_interfaces
          - vlans

    - name: Build NetBox sync facts
      ansible.builtin.set_fact:
        ios_interfaces: "{{ ansible_network_resources.interfaces | default([]) }}"
        ios_l2_interfaces: "{{ ansible_network_resources.l2_interfaces | default([]) }}"
        ios_vlans: "{{ ansible_network_resources.vlans | default([]) }}"

    - name: Ensure device exists in NetBox
      netbox.netbox.netbox_device:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        data:
          name: "{{ inventory_hostname }}"
          site: "{{ netbox_site }}"
          status: active
        state: present
      delegate_to: localhost

    - name: Ensure VLANs exist in NetBox
      netbox.netbox.netbox_vlan:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        data:
          name: "{{ item.name | default('VLAN ' ~ item.vlan_id) }}"
          vid: "{{ item.vlan_id }}"
          site: "{{ netbox_site }}"
          status: active
        state: present
      loop: "{{ ios_vlans }}"
      loop_control:
        label: "{{ item.vlan_id }} {{ item.name | default('') }}"
      when: item.vlan_id is defined
      delegate_to: localhost

    - name: Ensure device interfaces exist with descriptions
      netbox.netbox.netbox_device_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        data:
          device: "{{ inventory_hostname }}"
          name: "{{ item.name }}"
          type: >-
            {{ netbox_interface_type_map[item.name | regex_replace('[0-9/\.]+$', '')]
               | default(netbox_default_interface_type) }}
          description: "{{ item.description | default(omit) }}"
          enabled: "{{ item.enabled | default(true) }}"
        state: present
      loop: "{{ ios_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name is defined
      delegate_to: localhost

    - name: Apply access VLANs to NetBox interfaces
      netbox.netbox.netbox_device_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        data:
          device: "{{ inventory_hostname }}"
          name: "{{ item.name }}"
          mode: Access
          untagged_vlan:
            vid: "{{ item.access.vlan }}"
            site: "{{ netbox_site }}"
        state: present
      loop: "{{ ios_l2_interfaces }}"
      loop_control:
        label: "{{ item.name }} access VLAN {{ item.access.vlan | default('') }}"
      when:
        - item.name is defined
        - item.access is defined
        - item.access.vlan is defined
      delegate_to: localhost

    - name: Apply trunk VLANs to NetBox interfaces
      netbox.netbox.netbox_device_interface:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        validate_certs: "{{ netbox_validate_certs }}"
        data:
          device: "{{ inventory_hostname }}"
          name: "{{ item.name }}"
          mode: Tagged
          untagged_vlan: "{{ {'vid': item.trunk.native_vlan, 'site': netbox_site} if item.trunk.native_vlan is defined else omit }}"
          tagged_vlans: >-
            {{ item.trunk.allowed_vlans
               | default([])
               | map('regex_replace', '^(.*)$', '{"vid": "\\1", "site": "' ~ netbox_site ~ '"}')
               | map('from_json')
               | list }}
        state: present
      loop: "{{ ios_l2_interfaces }}"
      loop_control:
        label: "{{ item.name }} trunk"
      when:
        - item.name is defined
        - item.trunk is defined
        - item.trunk.allowed_vlans is defined
        - item.trunk.allowed_vlans | length > 0
      delegate_to: localhost
