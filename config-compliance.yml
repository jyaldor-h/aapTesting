---
- name: Validate Cisco IOS running configuration
  hosts: tags_ios:tags_ios-xe:!tags_scanOmit
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_network_cli_ssh_type: libssh
    compliance_file: compliance.txt




  pre_tasks:
    - name: Ensure SSH config directory exists
      ansible.builtin.file:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"
        state: directory
        mode: '0700'
      delegate_to: localhost
      run_once: true

    - name: Allow legacy KEX for older Cisco switches
      ansible.builtin.blockinfile:
        path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/config"
        create: true
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED LEGACY CISCO KEX"
        block: |
          Host *
              KexAlgorithms +diffie-hellman-group14-sha1,diffie-hellman-group-exchange-sha1
      delegate_to: localhost
      run_once: true


  tasks:
    - name: Collect running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: running_config
      changed_when: false

    - name: Load required configuration lines
      ansible.builtin.set_fact:
        required_config_lines: >-
          {{ lookup('ansible.builtin.file', compliance_file).splitlines()
             | map('trim')
             | reject('equalto', '')
             | reject('match', '^#')
             | list }}
        running_config_lines: >-
          {{ running_config.stdout[0].splitlines()
             | map('trim')
             | reject('equalto', '')
             | list }}

    - name: Identify missing configuration lines
      ansible.builtin.set_fact:
        missing_config_lines: >-
          {{ required_config_lines | difference(running_config_lines) }}

    - name: Build structured compliance result
      ansible.builtin.set_fact:
        compliance_result:
          host: "{{ inventory_hostname }}"
          compliant: "{{ missing_config_lines | length == 0 }}"
          missing_lines: "{{ missing_config_lines }}"

    - name: Publish structured compliance result to AAP
      ansible.builtin.set_stats:
        data:
          compliance_result: "{{ compliance_result }}"
        per_host: true
        aggregate: false

    - name: Report configuration compliance
      ansible.builtin.assert:
        that:
          - compliance_result.compliant
        success_msg: "{{ inventory_hostname }} is compliant"
        fail_msg: >-
          {{ inventory_hostname }} is not compliant. Missing commands:
          {{ missing_config_lines | join(', ') }}