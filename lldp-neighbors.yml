---
- name: Discover LLDP neighbors
  hosts: all
  gather_facts: false
  connection: ansible.netcommon.network_cli
  vars:
    ansible_network_os: cisco.ios.ios
  tasks:
    - name: Gather interface facts (includes LLDP/CDP neighbors)
      cisco.ios.ios_facts:
        gather_subset: interfaces

    - name: Show LLDP neighbors
      ansible.builtin.debug:
        msg: "{{ ansible_net_neighbors }}"
